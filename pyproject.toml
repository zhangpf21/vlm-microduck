[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-microduck"
version = "0.1.0"
description = "Vision and task code for MicroDuck experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.scripts]
vlm-microduck = "vlm_microduck.main:main"

[tool.setuptools.packages.find]
where = ["src"]
